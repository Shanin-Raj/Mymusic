name: sonic_vault_flutter
description: A native Flutter client for Sonic Vault.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Task 1.2 Dependencies
  http: ^1.1.0
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  shared_preferences: ^2.2.2
  provider: ^6.1.1

  # Essential utilities
  path_provider: ^2.1.1
  audio_session: ^0.1.18
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vinyl.jpg
    - assets/cassette.jpg
